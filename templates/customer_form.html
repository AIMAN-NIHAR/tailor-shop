{% extends "base.html" %}
{% block heading %}{{ t('edit_customer') if editing else t('add_customer') }}{% endblock %}

{% block content %}
<div class="card form-card">
  <form method="post">
    <div class="grid-2">
      <div class="field">
        <label for="name">{{ t('customer_name') }} *</label>
        <input id="name" name="name" value="{{ customer.name or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="phone">{{ t('phone') }}</label>
        <input id="phone" name="phone" type="tel" dir="ltr" value="{{ customer.phone or '' }}">
      </div>
    </div>

    <div class="field">
      <label for="address">{{ t('address') }}</label>
      <input id="address" name="address" value="{{ customer.address or '' }}">
    </div>

    <div class="field">
      <label for="notes">{{ t('notes') }}</label>
      <textarea id="notes" name="notes">{{ customer.notes or '' }}</textarea>
    </div>

    <div class="form-actions">
      <button class="btn" type="submit">{{ t('save') }}</button>
      <a class="btn btn-light" href="{{ url_for('customers') }}">{{ t('cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
